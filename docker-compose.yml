services:
  db:
    image: postgres:15-alpine
    container_name: vanroute-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: vanroute_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # cria o vanroute_test (banco dos testes) quando o volume e novo
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vanroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    container_name: vanroute-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: vanroute
      MINIO_ROOT_PASSWORD: vanroute123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # tarefas diarias (docs/WORKER.md). Fica num perfil: o "docker compose up" normal nao sobe;
  # pra subir: docker compose --profile worker up -d --build worker
  worker:
    build: ./worker
    container_name: vanroute-worker
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: vanroute_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: 123456
      WORKER_INTERVAL: 24h

volumes:
  postgres_data:
  redis_data:
  minio_data: