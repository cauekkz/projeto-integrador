<div class="esqueleto" role="status" aria-live="polite">
  <span class="so-leitor">{{ texto() }}</span>

  @switch (tipo()) {
    @case ('perfil') {
      <div class="topo" aria-hidden="true">
        <span class="bloco redondo"></span>
        <span class="linhas">
          <span class="bloco l60"></span>
          <span class="bloco l40"></span>
        </span>
      </div>
      @for (i of itens(); track i) {
        <div class="cartao" aria-hidden="true">
          <span class="bloco l30"></span>
          <span class="bloco l90"></span>
          <span class="bloco l70"></span>
        </div>
      }
    }
    @case ('texto') {
      <div class="cartao" aria-hidden="true">
        @for (i of itens(); track i) {
          <span class="bloco l90"></span>
          <span class="bloco l70"></span>
        }
      </div>
    }
    @default {
      @for (i of itens(); track i) {
        <div class="cartao linha" aria-hidden="true" [style.--i]="i">
          <span class="bloco redondo pequeno"></span>
          <span class="linhas">
            <span class="bloco l60"></span>
            <span class="bloco l40"></span>
          </span>
        </div>
      }
    }
  }
</div>
