<!-- VARIÂNCIA 1: HEADER DRIVER / HOME -->
@if (tipo === 'driver') {
  <header class="topbar">

      <button type="button" class="back-button" (click)="voltar()">
        <i class="bi bi-chevron-left"></i>
      </button>


    <div class="user-info" (click)="irParaPerfil()">
      <img [src]="fotoUrl" class="avatar" [alt]="nomeUsuario">
      <span class="name">{{ nomeUsuario }}</span>
    </div>

    <span class="role">{{ role }}</span>
  </header>
}

@else {
  <header class="header-geral">
    <button type="button" class="back-button" (click)="voltar()">
      <i class="bi bi-chevron-left"></i>
    </button>
    <h1>{{ titulo }}</h1>
  </header>
}
