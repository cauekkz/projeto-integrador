<div [ngClass]="['btn-wrapper', 'pos-' + posicao]">
  <button
    [type]="type"
    [ngClass]="['btn', 'btn-' + tipo]"
    [disabled]="disabled || carregando"
    [appCarregando]="carregando"
    (click)="onClick()">
    <ng-content></ng-content>
    @if (texto) {
      {{ texto }}
    }
  </button>
</div>
