<header class="topo">
  @if (mostrarVoltar()) {
    <button type="button" class="voltar" aria-label="Ir para o início" (click)="irParaHome()">
      <i class="bi bi-chevron-left" aria-hidden="true"></i>
    </button>
  }

  <div class="caixa">
    <ol class="migalhas">
      @for (item of trilha(); track $index; let ultimo = $last) {
        <li [class.atual]="ultimo" [attr.aria-current]="ultimo ? 'page' : null" [attr.title]="ultimo ? item : null">
          @if (!ultimo && destino($index, item); as url) {
            <button type="button" class="migalha-link" (click)="voltarParaAnterior(url)">{{ item }}</button>
          } @else {
            {{ item }}
          }
          @if (!ultimo) {
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          }
        </li>
      }
    </ol>

    <!-- foto e nome: abre o painel do perfil, igual ao topo das homes -->
    <button type="button" class="usuario" aria-label="Abrir perfil" (click)="mostrarPerfil.set(true)">
      <img [src]="foto()" alt="">
      <span>{{ nome() }}</span>
    </button>

    @if (mostrarSino()) {
      <button type="button" class="sino" aria-label="Notificações" (click)="notificacoes.abrirTela()">
        <i class="bi bi-bell" aria-hidden="true"></i>
        @if (notificacoes.naoLidas()) {
          <span class="badge" [attr.aria-label]="notificacoes.naoLidas() + ' não lidas'">{{ notificacoes.rotulo() }}</span>
        }
      </button>
    }
  </div>
</header>

@if (mostrarPerfil()) {
  <app-profile-select animate.leave="sair-perfil" [usuario]="usuario()" (fecharEvent)="mostrarPerfil.set(false)" />
}
