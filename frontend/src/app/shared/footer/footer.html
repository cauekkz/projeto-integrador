<nav class="bottombar" aria-label="Navegação principal">
  <button
    type="button"
    class="tab"
    aria-label="Início"
    [class.active]="abaAtiva === 'home'"
    (click)="clicarHome()">
    <i class="bi bi-house-door-fill" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="tab"
    [attr.aria-label]="tipoUsuario === 'motorista' ? 'Rotas' : 'Transporte'"
    [class.active]="abaAtiva === 'meio'"
    (click)="selecionarAba('meio')">
    @if (tipoUsuario === 'motorista') {
      <!-- icone de rota do Figma (public/rota.svg), pintado pela cor da aba -->
      <span class="icone-rota" aria-hidden="true"></span>
    } @else {
      <i class="bi bi-truck-front-fill" aria-hidden="true"></i>
    }
  </button>

  <button
    type="button"
    class="tab"
    aria-label="Conversas"
    [class.active]="abaAtiva === 'config'"
    (click)="selecionarAba('config')">
    <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
  </button>
</nav>
