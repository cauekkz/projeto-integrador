<app-header titulo="Validação de e-mail" (voltarEvent)="voltar()" />

<div class="code-container">
  <p class="email">{{ email }}</p>

  <app-code-input
    instrucao="Por favor, digite o código que enviamos agora para:"
    [mostrarReenviar]="true"
    [length]="6"
    (codigoVerificado)="onSend($event)"
    (reenviarEvent)="resend()"
  />
</div>
