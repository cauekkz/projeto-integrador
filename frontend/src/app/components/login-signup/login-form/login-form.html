<div class="login-container">
  <app-header
    titulo="Acessar {{ tipoUsuario === 'motorista' ? 'Motorista' : 'Responsável' }}"
    (voltarEvent)="voltar()"
  />

  <div class="content">
    <form (ngSubmit)="login()">

      @if (tipoUsuario === 'motorista') {
        <h2>Olá, que bom que você voltou!</h2>
        <label>CPF do motorista</label>
        <input type="text" placeholder="000.000.000-00" name="nome" [(ngModel)]="enteredCPF" appCpfMask required />
      }

      @if (tipoUsuario === 'responsavel') {
        <h2>Olá, que bom que você voltou!</h2>
        <label>CPF do responsável</label>
        <input type="text" placeholder="000.000.000-00" name="nome" [(ngModel)]="enteredCPF" appCpfMask required />
      }

      @if (cpfInvalido) {
        <p class="error-message">O CPF é obrigatório!</p>
      }

      <label>Senha</label>
      <input type="password" placeholder="Digite sua senha" name="senha" [(ngModel)]="enteredPass" required />

      @if (passInvalido) {
        <p class="error-message">A senha é obrigatória!</p>
      }

      <app-button
        texto="Entrar"
        tipo="primary"
        (clickEvent)="login()">
      </app-button>

      <app-button
        texto="Esqueceu sua senha?"
        tipo="secondary"
        (clickEvent)="mostrarForgotPassword = true">
      </app-button>

    </form>
  </div>

  <div class="bottom-container">
    <app-button
      texto="Criar uma conta"
      tipo="secondary"
      (clickEvent)="irParaCadastro()">
    </app-button>
  </div>
</div>

@if (mostrarForgotPassword) {
  <app-forgot-password (voltarEvent)="mostrarForgotPassword = false" />
}
