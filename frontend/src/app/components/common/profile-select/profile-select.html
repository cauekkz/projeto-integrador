<!-- .fundo > .folha: puxar pra baixo fecha (shared/arrastar-folha); a alca vem do styles.css -->
<div class="fundo" (click)="fechar()">
<div class="folha" role="dialog" aria-modal="true" aria-label="Menu do perfil" (click)="$event.stopPropagation()">

  <div class="perfil-topo">
    <img [src]="usuario?.photoUrl || '/testee.jpg'" class="avatar" alt="">
    <div class="perfil-info">
      <p class="perfil-nome">{{ usuario?.name || '' }}</p>
      <p class="perfil-email">{{ usuario?.email || '' }}</p>
    </div>
  </div>

  <div class="menu-lista">
    <button class="menu-item" (click)="irParaPerfil()">
      <i class="bi bi-person-gear" aria-hidden="true"></i>
      <span>Configurar perfil</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
    </button>

    @if (tipoUsuario === 'motorista') {
      <button class="menu-item" (click)="irParaCodigoConversa()">
        <i class="bi bi-key" aria-hidden="true"></i>
        <span>Código de conversa</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>

      <button class="menu-item" (click)="irParaEscolas()">
        <i class="bi bi-mortarboard" aria-hidden="true"></i>
        <span>Adicionar escola</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>

      <button class="menu-item" (click)="irPara('/driver-home')">
        <i class="bi bi-signpost-split" aria-hidden="true"></i>
        <span>Minhas rotas</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>

      <button class="menu-item" (click)="irPara('/driver-vehicles')">
        <i class="bi bi-bus-front" aria-hidden="true"></i>
        <span>Minhas vans</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>

      <button class="menu-item" (click)="irPara('/driver-pix')">
        <i class="bi bi-qr-code" aria-hidden="true"></i>
        <span>Chave Pix</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>

      <button class="menu-item" (click)="irPara('/driver-groups')">
        <i class="bi bi-people" aria-hidden="true"></i>
        <span>Grupos</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>
    }

    @if (tipoUsuario === 'responsavel') {
      <button class="menu-item" (click)="irParaVincularMotorista()">
        <i class="bi bi-person-plus" aria-hidden="true"></i>
        <span>Vincular motorista</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>
    }

    <button class="menu-item" (click)="irParaContratos()">
      <i class="bi bi-file-text" aria-hidden="true"></i>
      <span>Contratos</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
    </button>

    <button class="menu-item" (click)="irPara('/trip-history')">
      <i class="bi bi-clock-history" aria-hidden="true"></i>
      <span>Histórico de viagens</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
    </button>

    <button class="menu-item" (click)="irPara('/privacy')">
      <i class="bi bi-shield-lock" aria-hidden="true"></i>
      <span>Privacidade e dados</span>
      <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
    </button>

  </div>

  <div class="menu-lista">
    <button class="menu-item danger" (click)="sairDaConta()">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>Sair da conta</span>
    </button>
  </div>
</div>
</div>
