<div class="terms">
  <label class="aceite">
    <input
      type="checkbox"
      [checked]="aceito()"
      [disabled]="!termos()"
      (change)="alternar($any($event.target).checked)"
    />
    <span>
      Li e aceito os
      <button type="button" class="link" (click)="$event.preventDefault(); abrirPagina()">
        Termos de Uso e a Política de Privacidade
      </button>
      @if (termos(); as t) {
        <small>(versão {{ t.version }})</small>
      }
    </span>
  </label>
</div>

<!-- Figma "Ambos · Termos · modal no cadastro" (1035:768), em pagina cheia como "Privacidade e dados" -->
@if (paginaAberta() && termos(); as termos) {
  <div class="tela-termos" role="dialog" aria-modal="true" aria-labelledby="termos-titulo" animate.enter="entrar-fade">
    <div class="pagina">
      <app-header titulo="Termos de Uso" (voltarEvent)="fecharPagina()" />

      <main class="conteudo">
        <div class="cabeca">
          <h2 id="termos-titulo">Termos de Uso e Política de Privacidade</h2>
          <span>Versão {{ termos.version }}</span>
        </div>

        <div class="texto">
          <app-markdown-text [conteudo]="termos.content" [semTitulo]="true" />
        </div>
      </main>

      <div class="acoes">
        @if (aceito()) {
          <button type="button" class="btn btn-azul" (click)="fecharPagina()">Fechar</button>
        } @else {
          <button type="button" class="btn btn-azul" (click)="aceitarPelaPagina()">Li e aceito</button>
          <button type="button" class="btn btn-contorno" (click)="fecharPagina()">Fechar</button>
        }
      </div>
    </div>
  </div>
}
