@if (etapa === 1) {
  <div class="form-container">
    <div class="header">
      <button class="back-button" (click)="goBack()">
        <img src="/Back.png" alt="" />
      </button>
      <h1>Suas informações</h1>
    </div>
    <form class="form" (ngSubmit)="signup()">
      <div class="field">
        <label>Nome do motorista</label>
        <input type="text" placeholder="Digite seu nome" [(ngModel)]="enteredName" name="name" />

        @if (nameInvalido) {
          <p class="error-message">O nome é obrigatório!</p>
        }
      </div>

      <div class="field">
        <label>Email do motorista</label>
        <input
          type="email"
          placeholder="Digite seu email"
          [(ngModel)]="enteredEmail"
          name="email"
        />

        @if (emailInvalido) {
          <p class="error-message">O email é obrigatório!</p>
        }
      </div>

      <div class="field">
        <label>Telefone do motorista</label>
        <input type="text" placeholder="11 99999-9999" [(ngModel)]="enteredPhone" name="phone" />

        @if (phoneInvalido) {
          <p class="error-message">O telefone é obrigatório!</p>
        }
      </div>

      <div class="field">
        <label>Senha</label>
        <input
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="enteredPass"
          name="password"
        />

        @if (passInvalido) {
          <p class="error-message">A senha é obrigatória!</p>
        }
      </div>

      <div class="field">
        <label>Confirmar senha</label>
        <input
          type="password"
          placeholder="Digite a senha novamente"
          [(ngModel)]="enteredConfirmPass"
          name="confirmPassword"
        />

        @if (confirmPassInvalido) {
          <p class="error-message">Confirme sua senha!</p>
        }
      </div>
      <button class="btn-primary" type="submit">Finalizar cadastro</button>
    </form>
  </div>
}
