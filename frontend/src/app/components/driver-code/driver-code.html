<div class="driver-code-container">
  <app-header titulo="Vincular Motorista" (voltarEvent)="voltar()" />

  <div class="content">
    <h1>Digite o código do motorista</h1>
    <p class="description">
      Digite o código fornecido pelo motorista para vinculá-lo à sua conta.
    </p>

    <app-code-input
      [length]="9"
      [separadores]="[3, 6]"
      instrucao=""
      textoBotao="Confirmar"
      (codigoVerificado)="confirmar($event)"
    />
  </div>
</div>
