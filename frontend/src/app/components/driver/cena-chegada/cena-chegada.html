<!-- postes parados na beira da estrada (de noite a lampada acende e ilumina a pista) -->
<span class="chegada-postes"><i><b></b></i><i><b></b></i><i><b></b></i></span>
<!-- o destino no fim da estrada -->
@if (destino() === 'escola') {
  <svg class="chegada-destino" viewBox="0 0 74 60" width="74" height="60">
    <!-- mastro com a bandeira -->
    <rect class="mastro" x="6" y="2" width="2" height="56" rx="1" />
    <path class="bandeira" d="M8 3 L22 6 L8 10 Z" />
    <!-- predio: corpo, frontao com o relogio e a porta no meio -->
    <rect class="parede" x="14" y="24" width="58" height="34" rx="2" />
    <path class="telhado" d="M30 24 L43 11 L56 24 Z" />
    <circle class="relogio" cx="43" cy="19" r="3.2" />
    <rect class="janela" x="19" y="30" width="9" height="8" rx="1.5" />
    <rect class="janela" x="58" y="30" width="9" height="8" rx="1.5" />
    <rect class="janela" x="19" y="44" width="9" height="8" rx="1.5" />
    <rect class="janela" x="58" y="44" width="9" height="8" rx="1.5" />
    <path class="porta" d="M37 58 L37 41 Q43 35 49 41 L49 58 Z" />
  </svg>
} @else {
  <svg class="chegada-destino" viewBox="0 0 60 56" width="60" height="56">
    <rect class="chamine" x="40" y="8" width="7" height="14" rx="1" />
    <rect class="parede" x="8" y="26" width="46" height="30" rx="2" />
    <path class="telhado" d="M3 28 L31 6 L59 28 Z" />
    <rect class="janela" x="14" y="33" width="12" height="10" rx="1.5" />
    <rect class="porta" x="34" y="36" width="12" height="20" rx="2" />
    <circle class="macaneta" cx="43" cy="47" r="1" />
  </svg>
}
<!-- chegou: check em cima do destino -->
<span class="chegada-check" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
<svg class="chegada-van" viewBox="0 0 96 44" width="100" height="46">
  <path class="van-lataria" d="M6 10 Q6 4 12 4 L62 4 Q68 4 72 8 L84 20 Q90 21 90 27 L90 32 Q90 35 87 35 L9 35 Q6 35 6 32 Z" />
  <rect class="van-vidro" x="12" y="9" width="14" height="10" rx="2" />
  <rect class="van-vidro" x="30" y="9" width="14" height="10" rx="2" />
  <rect class="van-vidro" x="48" y="9" width="12" height="10" rx="2" />
  <path class="van-vidro" d="M64 9 L69 9 Q70.5 9 71.5 10 L79.5 19 L64 19 Z" />
  <rect class="van-faixa" x="6" y="24" width="84" height="3" />
  <rect class="van-farol" x="85" y="22" width="4" height="3" rx="1.2" />
  <rect class="van-freio" x="6" y="21" width="2.5" height="5" rx="1" />
  <g class="van-roda" style="transform-origin: 24px 35px">
    <circle cx="24" cy="35" r="7" class="van-pneu" />
    <circle cx="24" cy="35" r="3" class="van-calota" />
    <rect x="23.2" y="29.5" width="1.6" height="11" rx="0.8" class="van-raio" />
  </g>
  <g class="van-roda" style="transform-origin: 72px 35px">
    <circle cx="72" cy="35" r="7" class="van-pneu" />
    <circle cx="72" cy="35" r="3" class="van-calota" />
    <rect x="71.2" y="29.5" width="1.6" height="11" rx="0.8" class="van-raio" />
  </g>
</svg>
<span class="chegada-estrada"></span>
