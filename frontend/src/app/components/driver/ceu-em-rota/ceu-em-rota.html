<!-- as camadas ficam sempre no DOM e so trocam de opacidade: a virada de um periodo pro outro e um fade -->
<span class="ceu ceu-dia"></span>
<span class="ceu ceu-tarde"></span>
<!-- vai fechando em azul escuro conforme chega perto das 18h -->
<span class="ceu ceu-anoitecendo"></span>

<span class="sol sol-dia"><span class="sol-brilho"></span><span class="sol-disco"></span></span>
<span class="sol sol-tarde"><span class="sol-brilho"></span><span class="sol-disco"></span></span>

<span class="estrelas">
  @for (e of estrelas; track $index) {
    <i [style.left.%]="e[0]" [style.top.%]="e[1]" [style.width.px]="e[2]" [style.height.px]="e[2]"
       [style.animation-duration.s]="e[3]" [style.animation-delay.s]="-e[4]"></i>
  }
</span>

<svg class="lua" viewBox="0 0 40 40" width="34" height="34">
  <defs>
    <linearGradient id="ceu-lua-cor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2" />
      <stop offset="1" stop-color="#e7dcb8" />
    </linearGradient>
    <mask id="ceu-lua-recorte">
      <rect width="40" height="40" fill="#fff" />
      <circle cx="27" cy="13" r="10" fill="#000" />
    </mask>
  </defs>
  <!-- crescente: circulo recortado por outro deslocado pra cima e pra direita -->
  <g mask="url(#ceu-lua-recorte)">
    <circle cx="19" cy="21" r="12" fill="url(#ceu-lua-cor)" />
    <circle cx="13.5" cy="22" r="2" class="lua-cratera" />
    <circle cx="18.5" cy="28.5" r="1.3" class="lua-cratera" />
    <circle cx="11.5" cy="16.5" r="1" class="lua-cratera" />
  </g>
</svg>
