<div class="dependentes-container">
  <app-header titulo="Dependentes" (voltarEvent)="voltar()"></app-header>

  <app-button texto="Adicionar dependente" tipo="primary" (clickEvent)="adicionarDependente()"></app-button>

  <div class="lista-dependentes">
    @if (carregando()) {
      <p class="estado-vazio">Carregando...</p>
    }

    @if (!carregando() && dependentes().length === 0) {
      <p class="estado-vazio">Nenhum dependente cadastrado ainda.</p>
    }

    @for (dep of dependentes(); track dep.id) {
      <button type="button" class="dependente-card dependente-linha" (click)="abrirDependente(dep)">
        @if (dep.photoUrl && !fotos.falhou(dep.photoUrl)) {
          <img class="dependente-avatar" [src]="dep.photoUrl" alt="" (error)="fotos.marcar(dep.photoUrl)" />
        } @else {
          <span class="dependente-avatar dependente-iniciais" aria-hidden="true">{{ iniciais(dep.name) }}</span>
        }
        <span class="dependente-nome">{{ dep.name }}</span>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    }
  </div>

  <app-footer tipoUsuario="responsavel" />
</div>
