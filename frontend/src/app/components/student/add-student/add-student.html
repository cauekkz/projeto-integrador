<div class="add-container">
  @if (etapa === 'form') {
    <app-header titulo="Suas informações" (voltarEvent)="voltar()"></app-header>

    <div class="photo-card" (click)="abrirBottomSheet()">
      <div class="photo-content">
        <img src="/Camera.png" alt="" class="camera-icon" />
        <p>Coloque uma foto do seu dependente</p>
      </div>
    </div>

    <form class="form">
      <div class="field">
        <label>Nome do dependente</label>
        <input type="text" placeholder="Nome do dependente" [(ngModel)]="enteredName" name="name" appNameFormat />
      </div>

      <div class="field">
        <label>Data de nascimento</label>
        <input
          type="text"
          placeholder="00/00/0000"
          [(ngModel)]="enteredBirthdate"
          name="birthdate"
          appDateMask
        />
      </div>

      <div class="field">
        <label>Observações</label>
        <textarea
          placeholder="Coloque aqui informações necessárias que o motorista precise saber sobre seu dependente. Ex: auxílio para subir na van, tomar remédios."
          [(ngModel)]="enteredObservacoes"
          name="observacoes"
          maxlength="1200">
        </textarea>
        <span class="counter">{{ enteredObservacoes.length }}/{{ maxObs }}</span>
      </div>

      <div class="field">
        <label for="relationType">Tipo de relação</label>

        <select id="relationType" [(ngModel)]="enteredRelationType" name="relationType" required>
          <option value="" disabled>Selecione uma opção</option>
          <option value="FINANCIAL">Financeiro</option>
          <option value="LEGAL">Legal</option>
          <option value="WITHDRAWAL">Retirada</option>
        </select>
      </div>

      <div class="bottom-actions">
        <app-button texto="Pronto" tipo="primary" (clickEvent)="pronto()"></app-button>
        <app-button texto="Tenho um código" tipo="secondary" (clickEvent)="vincularDependente()"></app-button>
      </div>
    </form>
  }

  @if (etapa === 'code') {
    <app-header titulo="Suas informações" (voltarEvent)="voltar()" />

    <div class="code-result">
      <p class="code-instrucao">
        Envie este código para o motorista vincular o dependente <strong>{{ enteredName }}</strong>:
      </p>

      <div class="code-box">
        <span>{{ codigoGerado }}</span>
        <button type="button" class="btn-copy" (click)="copiarCodigo()">
          {{ copiado ? 'Copiado!' : 'Copiar' }}
        </button>
      </div>

      <app-button texto="Concluir" tipo="primary" (clickEvent)="concluir()"></app-button>
    </div>
  }
</div>

@if (mostrarBottomSheet) {
  <div class="overlay" (click)="fecharBottomSheet()"></div>
  <div class="bottom-sheet">
    <h2>Selecione de onde vem a foto</h2>
    <div class="sheet-options">
      <button class="sheet-btn" (click)="fecharBottomSheet()">
        <img src="/Add%20Image.svg" alt="" />
        Galeria
      </button>
      <button class="sheet-btn" (click)="fecharBottomSheet()">
        <img src="/Camera.png" alt="" />
        Tirar com a câmera
      </button>
    </div>
  </div>
}
