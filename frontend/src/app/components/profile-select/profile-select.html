<div class="backdrop" (click)="fechar()"></div>

<div class="sheet">
  <div class="sheet-handle"></div>

  <div class="perfil-topo">
    <img [src]="usuario?.photoUrl || '/testee.jpg'" class="avatar" alt="">
    <div class="perfil-info">
      <p class="perfil-nome">{{ usuario?.name || 'exemple' }}</p>
      <p class="perfil-email">{{ usuario?.email || 'exemple@example.com' }}</p>
    </div>
  </div>

  <div class="menu-lista">
    <button class="menu-item" (click)="irParaPerfil()">
      <i class="bi bi-person-gear"></i>
      <span>Configurar perfil</span>
    </button>

    <button class="menu-item">
      <i class="bi bi-file-text"></i>
      <span>Contratos</span>
    </button>

    <button class="menu-item danger" (click)="sairDaConta()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Sair da conta</span>
    </button>
  </div>
</div>
