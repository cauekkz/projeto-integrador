<main class="home">
  <header class="topo">
    <h1 class="marca" aria-label="VanRoute"></h1>
    <p class="slogan">Transporte escolar com tranquilidade</p>
  </header>

  <div class="palco" aria-hidden="true">
    <span class="brilho"></span>
    <img src="/ImageLoginAndChoose.png" alt="" class="ilustracao" width="374" height="328">
  </div>

  <section class="escolha" aria-labelledby="escolha-titulo">
    <h2 id="escolha-titulo" class="titulo">Escolha seu tipo de usuário</h2>

    <a class="lg-button botao botao-cheio" data-variant="filled" routerLink="/login/motorista">
      <i class="bi bi-person-badge" aria-hidden="true"></i>
      Sou motorista
    </a>
    <a class="lg-button lg-glass botao botao-vidro" routerLink="/login/responsavel">
      <i class="bi bi-people" aria-hidden="true"></i>
      Sou responsável
    </a>
  </section>
</main>
