<div class="profile-container">
  <app-header titulo="Informações do perfil" (voltarEvent)="voltar()" />

  <div class="profile-wrapper">
    <div class="avatar-container">
      <img [src]="usuario.photoUrl || '/testee.jpg'" class="avatar-grande" alt="Foto do usuário">
    </div>

    <div class="hero">
      <div class="hero-label">Informações pessoais</div>
    </div>

    <div class="body-white">
      <div class="info-card">
        @if (!modoEdicao) {
          <div class="field">
            <input type="text" [(ngModel)]="usuario.name" placeholder="Nome completo" name="name" readonly>
          </div>

          <div class="field">
            <input type="text" [(ngModel)]="usuario.cpf" placeholder="CPF/Documento" name="cpf" readonly>
          </div>


          <div class="field">
            <input type="email" [(ngModel)]="usuario.email" placeholder="E-mail" name="email" readonly>
          </div>

          <div class="field">
            <input type="text" [(ngModel)]="usuario.phone" placeholder="Telefone" name="phone" readonly>
          </div>
        }

        @if (modoEdicao) {
          <div class="field">
            <input type="email" [(ngModel)]="enteredEmail" placeholder="E-mail" name="email">
          </div>

          <div class="field">
            <input type="text" [(ngModel)]="enteredPhone" placeholder="Telefone" name="phone" appPhoneMask>
          </div>

          <div class="field">
            <input
              type="text"
              [(ngModel)]="enteredCode"
              placeholder="Código de verificação"
              name="verificationCode"
              autocomplete="one-time-code"
            >
          </div>

          <button
            class="btn-secondary"
            type="button"
            (click)="solicitarCodigo()"
            [disabled]="salvando"
          >
            Enviar código por e-mail
          </button>
        }

        <section class="password-section" aria-labelledby="password-title">
          <h2 id="password-title">Alterar senha</h2>
          <p>Solicite um código enviado para o seu e-mail e informe a nova senha.</p>

          <div class="field">
            <input
              type="password"
              [(ngModel)]="enteredPassword"
              placeholder="Nova senha"
              name="newPassword"
              autocomplete="new-password"
            >
          </div>

          <div class="field">
            <input
              type="password"
              [(ngModel)]="enteredConfirmPassword"
              placeholder="Repita a nova senha"
              name="confirmNewPassword"
              autocomplete="new-password"
            >
          </div>

          <div class="field">
            <input
              type="text"
              [(ngModel)]="enteredPasswordCode"
              placeholder="Código de verificação"
              name="passwordVerificationCode"
              autocomplete="one-time-code"
            >
          </div>

          <button
            class="btn-secondary"
            type="button"
            (click)="solicitarCodigoSenha()"
            [disabled]="salvando"
          >
            Enviar código por e-mail
          </button>
          <button
            class="btn-primary"
            type="button"
            (click)="alterarSenha()"
            [disabled]="salvando"
          >
            {{ salvando ? 'Salvando...' : 'Atualizar senha' }}
          </button>
        </section>

        @if (mensagem) {
          <p class="status-message" role="status">{{ mensagem }}</p>
        }
      </div>

      <div class="btn-area">
        @if (!modoEdicao) {
          <button class="btn-primary" (click)="editar()">Editar</button>
        }

        @if (modoEdicao) {
          <button class="btn-primary" (click)="salvar()" [disabled]="salvando">
            {{ salvando ? 'Salvando...' : 'Salvar dados' }}
          </button>
          <button class="btn-secondary" (click)="cancelar()" [disabled]="salvando">Cancelar</button>
        }
      </div>
    </div>
  </div>
</div>
