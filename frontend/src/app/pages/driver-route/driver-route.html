<div class="screen">

  <app-header
    tipo="driver"
    nomeUsuario="Gustavo Gomez"
    [qtdNotificacoes]="1"
    (voltarEvent)="voltar()"
    (perfilEvent)="irParaPerfil()">
  </app-header>

  <div class="mapa">
    <img src="/mapa-placeholder.png" alt="Mapa" class="mapa-img">
  </div>

  <div class="listas">

    <!-- Lista: Alunos Esperando -->
    <div class="lista-card">
      <button class="lista-header" type="button" (click)="toggleEsperando()">
        <div class="icon-box icon-amarelo">
          <i class="bi bi-people"></i>
        </div>
        <span class="lista-titulo">Alunos Esperando</span>
        <span class="lista-count">{{ alunosEsperando.length }}</span>
        @if (alunosEsperandoAberto) {
          <img src="/Back.svg" class="chevron-icon" alt="Fechar">
        } @else {
          <img src="/up.svg" class="chevron-icon" alt="Abrir">
        }
      </button>

      @if (alunosEsperandoAberto) {
        @for (aluno of alunosEsperando; track aluno.nome) {
          <div class="aluno-item">
            <img src="/testee.jpg" class="aluno-avatar" alt="">
            <div class="aluno-info">
              <span class="aluno-nome">{{ aluno.nome }}</span>
              <span class="aluno-end">{{ aluno.endereco }}</span>
            </div>
          </div>
        }
      }
    </div>

    <!-- Lista: Alunos Embarcados -->
    <div class="lista-card">
      <button class="lista-header" type="button" (click)="toggleEmbarcados()">
        <div class="icon-box icon-azul">
          <i class="bi bi-people"></i>
        </div>
        <span class="lista-titulo">Alunos Embarcados</span>
        <span class="lista-count">{{ alunosEmbarcados.length }}</span>
        @if (alunosEmbarcadosAberto) {
          <img src="/Back.svg" class="chevron-icon" alt="Fechar">
        } @else {
          <img src="/up.svg" class="chevron-icon" alt="Abrir">
        }
      </button>

      @if (alunosEmbarcadosAberto) {
        @for (aluno of alunosEmbarcados; track aluno.nome) {
          <div class="aluno-item">
            <img src="/testee.jpg" class="aluno-avatar" alt="">
            <div class="aluno-info">
              <span class="aluno-nome">{{ aluno.nome }}</span>
              <span class="aluno-end">{{ aluno.endereco }}</span>
            </div>
          </div>
        }
      }
    </div>

  </div>

  @if (mostrarPerfil) {
    <app-profile-select (fecharEvent)="fecharPerfil()"></app-profile-select>
  }

</div>
