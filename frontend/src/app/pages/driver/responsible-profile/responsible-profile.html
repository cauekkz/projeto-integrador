<div class="pagina">
  <app-header titulo="Responsável" (voltarEvent)="voltar()" />

  <main class="conteudo">
    @if (carregando()) {
      <div class="sk-tela" role="status" aria-label="Carregando perfil..."><div class="sk-linha"><app-skeleton variante="circle" largura="72px" altura="72px" /><div class="sk-col"><app-skeleton variante="title" largura="60%" altura="22px" /><app-skeleton variante="text" largura="40%" /></div></div>@for (i of [0,1]; track i) {<app-skeleton variante="card"><app-skeleton variante="text" largura="35%" altura="14px" /><app-skeleton variante="text" [quantos]="2" /></app-skeleton>}</div>
    } @else if (perfil(); as p) {
      <section class="quem" animate.enter="entrar-fade">
        @if (foto()) {
          <img class="foto" [src]="foto()" alt="" />
        } @else {
          <span class="foto iniciais" aria-hidden="true">{{ iniciais(p.name) }}</span>
        }
        <div>
          <h1>{{ p.name }}</h1>
          @if (p.phone) {
            <p class="desde">{{ formatarTelefone(p.phone) }}</p>
          }
        </div>
      </section>

      <app-responsible-situation [perfil]="p" modo="motorista" />
    } @else if (indisponivel()) {
      <div class="rodape-acao fixo">
        <button type="button" class="btn btn-azul" (click)="voltar()">Voltar</button>
      </div>
    }
  </main>
</div>
