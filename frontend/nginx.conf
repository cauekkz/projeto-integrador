# Front em producao: entrega o site e repassa a API, os WebSockets e os arquivos, igual o proxy.conf.json
# faz no "ng serve". "backend" e "minio" sao os nomes dos servicos no docker-compose.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # o padrao e 1 MB; PDF de contrato, CNH e CRLV vao ate 10 MB
    client_max_body_size 11m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # rotas do Angular: qualquer caminho que nao e arquivo abre o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos com hash no nome: cache longo. O "^~" dos blocos de baixo faz /api, /ws e /storage
    # ganharem desta regra (sem ele, a foto enviada pro /storage/....png caia aqui e dava 404)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://backend:9090;
        proxy_set_header Host $host;
        # o limite de tentativas de login e por IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: /ws/chat/... vira /chat/... no backend (a barra final tira o /ws)
    location ^~ /ws/ {
        proxy_pass http://backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        # o token vai na URL do WebSocket: nao pode ir pro log
        access_log off;
    }

    # links assinados do MinIO. O Host fica "minio:9000", o mesmo da assinatura
    location ^~ /storage/ {
        proxy_pass http://minio:9000/;
        proxy_buffering off;
    }
}
