spring.profiles.active=local

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SENDER_EMAIL}
spring.mail.password=${SENDER_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


openrouteservice.api-key=${ORS_API_KEY:}
openrouteservice.url=${ORS_DIRECTIONS_URL:https://api.openrouteservice.org/v2/directions/driving-car}

# botar aql notação que tenta pegar primeiro uma variavel de ambiente e dps tenta esse local
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

openrouteservice.geocode-url=${ORS_GEOCODE_URL:https://api.openrouteservice.org/geocode/search}

# de quanto em quanto tempo (com o GPS chegando) recalcula trajeto e tempos pela API de rotas (cota da chave: 200/dia)
trip.eta-refresh-seconds=${TRIP_ETA_REFRESH_SECONDS:300}
# saiu mais que isso (metros) da linha: recalcula antes, com no minimo off-route-min-seconds entre chamadas
trip.off-route-meters=${TRIP_OFF_ROUTE_METERS:150}
trip.off-route-min-seconds=${TRIP_OFF_ROUTE_MIN_SECONDS:30}
# embarque/desembarque so com a van a ate essa distancia (metros) do ponto do aluno; 0 desliga
trip.max-stop-distance-meters=${TRIP_MAX_STOP_DISTANCE_METERS:1000}
