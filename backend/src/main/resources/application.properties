spring.profiles.active=local
# senhas e chaves: o .env da raiz do projeto (o mesmo do Docker). Rodando de dentro de backend/ ele esta em ../.env.
# No Docker e no CI os valores chegam como variaveis de ambiente, que ganham deste arquivo
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SENDER_EMAIL}
spring.mail.password=${SENDER_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# o envio ja e em segundo plano (AsyncConfig); os limites so evitam uma thread presa se o Gmail nao responder
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


openrouteservice.api-key=${ORS_API_KEY:}
openrouteservice.url=${ORS_DIRECTIONS_URL:https://api.heigit.org/openrouteservice/v2/directions/driving-car}

# botar aql notação que tenta pegar primeiro uma variavel de ambiente e dps tenta esse local
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

openrouteservice.geocode-url=${ORS_GEOCODE_URL:https://api.heigit.org/pelias/v1/search}
# coordenada do endereco pelo CEP (AwesomeAPI, sem chave); se nao achar, usa a busca da OpenRouteService acima.
# CEP_GEOCODE_URL= (vazio) desliga: os testes de API usam so o simulador do stubs.py
cep.geocode-url=${CEP_GEOCODE_URL:https://cep.awesomeapi.com.br/json}

# de quanto em quanto tempo (com o GPS chegando) recalcula trajeto e tempos pela API de rotas (cota da chave: 200/dia)
trip.eta-refresh-seconds=${TRIP_ETA_REFRESH_SECONDS:300}
# saiu mais que isso (metros) da linha: recalcula antes, com no minimo off-route-min-seconds entre chamadas
trip.off-route-meters=${TRIP_OFF_ROUTE_METERS:150}
trip.off-route-min-seconds=${TRIP_OFF_ROUTE_MIN_SECONDS:30}
# embarque/desembarque so com a van a ate essa distancia (metros) do ponto do aluno; 0 desliga
trip.max-stop-distance-meters=${TRIP_MAX_STOP_DISTANCE_METERS:1000}

# quem pode chamar a API e abrir os WebSockets (CORS + WebSocket). Producao: ALLOWED_ORIGINS=https://app.dominio.com
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*]}
