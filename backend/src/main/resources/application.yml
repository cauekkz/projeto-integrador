#server:
#port: 9090

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/${DATABASE_NAME:vanroute_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    expiration: ${JWT_EXPIRATION:900000} #15 minutos
    key: ${JWT_KEY:4QcYHiOKv6R1GIost25MwdDJNLayEubr3kj9nW8AxZqSFX0gfmhUTepCBPlV7z}
  flyway:
    enabled: true
    locations: classpath:db/migration