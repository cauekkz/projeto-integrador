server:
  port: 9090
  # atras do Nginx: o IP de quem chamou vem do X-Forwarded-For (limite de tentativas de login por IP)
  forward-headers-strategy: framework

#openrouteservice:
#  api-key: ${OPENROUTESERVICE_API_KEY}
#  base-url: https://api.openrouteservice.org

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:vanroute_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    # em desenvolvimento liga no application-local.yml
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # segredos sem valor padrao: em producao vem das variaveis de ambiente; em desenvolvimento,
  # do application-local.properties (fora do git). Sem eles o backend nao sobe
  jwt:
    expiration: ${JWT_EXPIRATION:900000}
    # refreshToken: 30 dias (o app renova o JWT de 15 min sem pedir a senha)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    key: ${JWT_KEY}
  
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  cloud:
    aws:
      credentials:
        access-key: ${MINIO_ACCESS_KEY}
        secret-key: ${MINIO_SECRET_KEY}
      s3:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        bucket: ${MINIO_BUCKET_NAME:vanroute-storage}
      region:
        static: us-east-1

# Swagger desligado por padrao (producao). Em desenvolvimento o application-local.yml liga
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
