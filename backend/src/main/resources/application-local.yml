# perfil de desenvolvimento (spring.profiles.active=local no application.properties). Sem segredo nenhum:
# os segredos de desenvolvimento ficam no application-local.properties (fora do git).
# Em producao o perfil e outro (SPRING_PROFILES_ACTIVE=prod) e nada daqui vale
spring:
  jpa:
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
